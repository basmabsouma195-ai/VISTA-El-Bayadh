name: Android build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  assemble-debug:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Restore offline recognition image cache
        uses: actions/cache@v4
        with:
          path: app/src/main/assets/recognition/references
          key: vista-recognition-seed-v2-${{ hashFiles('dataset/recognition/source-manifest.json') }}
          restore-keys: |
            vista-recognition-seed-v2-
      - name: Bundle offline recognition image assets
        env:
          VISTA_FETCH_REMOTE_SEED_IMAGES: 'true'
        run: python3 scripts/fetch_recognition_seed_images.py
      - name: Validate offline catalogue and local image index
        run: python3 scripts/validate_offline_catalogue.py
      - name: Run recognition policy unit tests
        run: gradle --no-daemon :app:testDebugUnitTest
      - name: Assemble debug APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: vista-el-bayadh-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
