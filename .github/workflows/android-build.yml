name: Android build

on:
  push:
    branches: [ main, feature/el-bayadh-offline-map ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: android-build-offline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  assemble-debug:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download latest successful El Bayadh offline map package
        uses: dawidd6/action-download-artifact@v6
        with:
          github_token: ${{ github.token }}
          repo: ${{ github.repository }}
          workflow: build-el-bayadh-offline-map.yml
          workflow_conclusion: success
          branch: feature/el-bayadh-offline-map
          name: vista-el-bayadh-offline-map-data
          path: ${{ runner.temp }}/vista-el-bayadh-map-package
          if_no_artifact_found: fail

      - name: Install verified offline map and local places index into Android assets
        shell: bash
        run: |
          set -euo pipefail
          PACKAGE="${{ runner.temp }}/vista-el-bayadh-map-package"
          test -s "$PACKAGE/el-bayadh.map"
          test -s "$PACKAGE/el-bayadh-pois.json"
          test -s "$PACKAGE/SHA256SUMS"
          (cd "$PACKAGE" && sed 's#build/el-bayadh/##g' SHA256SUMS | sha256sum -c -)
          mkdir -p app/src/main/assets/maps
          cp "$PACKAGE/el-bayadh.map" app/src/main/assets/maps/el-bayadh.map
          cp "$PACKAGE/el-bayadh-pois.json" app/src/main/assets/maps/el-bayadh-pois.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          root = Path("app/src/main/assets/maps")
          map_file = root / "el-bayadh.map"
          places_file = root / "el-bayadh-pois.json"
          places = json.loads(places_file.read_text(encoding="utf-8"))
          items = places.get("items", []) if isinstance(places, dict) else []
          if not items or places.get("wilaya_code") != 32:
              raise SystemExit("Offline El Bayadh places index is empty or has an unexpected region.")
          target = next((item for item in items if item.get("osm_id") == 490536990), None)
          if not target or target.get("name_ar") != "الأبيض سيدي الشيخ":
              raise SystemExit("Offline places index is missing El Abiodh Sidi Cheikh.")
          print(f"Bundled map: {map_file.stat().st_size:,} bytes")
          print(f"Bundled named places: {len(items)}")
          print(f"Verified town: {target['name']} ({target['name_ar']})")
          PY

      - name: Install optional user-confirmed field photo bundle
        shell: bash
        run: |
          BUNDLE="VISTA-El-Bayadh-Field-Photos-Integration.zip"
          if [ -f "$BUNDLE" ]; then
            unzip -o "$BUNDLE" -d .
            python3 - <<'PY'
          import json
          from pathlib import Path
          manifest = Path("app/src/main/assets/content/field-photo-gallery.json")
          data = json.loads(manifest.read_text(encoding="utf-8"))
          images = data.get("images", [])
          missing = [
              item.get("assetPath", "")
              for item in images
              if not (Path("app/src/main/assets") / item.get("assetPath", "")).is_file()
          ]
          if missing:
              raise SystemExit("Missing field gallery assets: " + ", ".join(missing))
          if any(item.get("recognitionApproved", False) for item in images):
              raise SystemExit("Field gallery photos must not be auto-approved for recognition.")
          print(f"Validated {len(images)} user-confirmed gallery photos.")
          PY
          else
            echo "No field-photo bundle uploaded; building without user field-photo assets."
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore offline recognition image cache
        uses: actions/cache@v4
        with:
          path: |
            app/src/main/assets/recognition/references
            app/src/main/assets/recognition/mobilenet_v3_small.tflite
          key: vista-recognition-seed-v3-${{ hashFiles('dataset/recognition/source-manifest.json', 'scripts/fetch_recognition_model.py') }}
          restore-keys: |
            vista-recognition-seed-v3-

      - name: Bundle offline recognition image assets
        env:
          VISTA_FETCH_REMOTE_SEED_IMAGES: 'false'
        run: python3 scripts/fetch_recognition_seed_images.py

      - name: Fetch and verify pinned MobileNetV3 model
        run: python3 scripts/fetch_recognition_model.py

      - name: Validate offline catalogue and local image index
        run: python3 scripts/validate_offline_catalogue.py

      - name: Validate field recognition dataset readiness
        run: |
          python3 -m py_compile scripts/register_field_photo.py scripts/verify_field_photo.py scripts/validate_recognition_dataset.py
          python3 scripts/validate_recognition_dataset.py
          python3 -m unittest scripts/test_recognition_dataset_validator.py

      - name: Run recognition policy unit tests
        run: gradle --no-daemon :app:testDebugUnitTest

      - name: Clean and assemble fresh APK
        run: gradle --no-daemon clean :app:assembleDebug

      - name: Verify offline map is embedded in debug APK
        run: |
          python3 - <<'PY'
          import zipfile
          from pathlib import Path
          apk = Path("app/build/outputs/apk/debug/app-debug.apk")
          required = ("assets/maps/el-bayadh.map", "assets/maps/el-bayadh-pois.json")
          with zipfile.ZipFile(apk) as archive:
              names = set(archive.namelist())
              missing = [name for name in required if name not in names]
              if missing:
                  raise SystemExit("APK is missing bundled offline map assets: " + ", ".join(missing))
              for name in required:
                  info = archive.getinfo(name)
                  if info.file_size <= 0:
                      raise SystemExit(f"Bundled asset is empty: {name}")
                  print(f"Verified in debug APK: {name} ({info.file_size:,} bytes)")
          PY

      - name: Prepare stable release signing key
        id: release-signing
        shell: bash
        env:
          VISTA_KEYSTORE_BASE64: ${{ secrets.VISTA_KEYSTORE_BASE64 }}
          VISTA_KEYSTORE_PASSWORD: ${{ secrets.VISTA_KEYSTORE_PASSWORD }}
          VISTA_KEY_ALIAS: ${{ secrets.VISTA_KEY_ALIAS }}
          VISTA_KEY_PASSWORD: ${{ secrets.VISTA_KEY_PASSWORD }}
        run: |
          if [ -n "$VISTA_KEYSTORE_BASE64" ] && [ -n "$VISTA_KEYSTORE_PASSWORD" ] && [ -n "$VISTA_KEY_ALIAS" ] && [ -n "$VISTA_KEY_PASSWORD" ]; then
            KEYSTORE_PATH="$RUNNER_TEMP/vista-release-key.jks"
            printf '%s' "$VISTA_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
            test -s "$KEYSTORE_PATH"
            echo "VISTA_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Stable signing secrets are not configured yet; debug APK only."
          fi

      - name: Build stable signed release APK
        if: steps.release-signing.outputs.ready == 'true'
        env:
          VISTA_KEYSTORE_PASSWORD: ${{ secrets.VISTA_KEYSTORE_PASSWORD }}
          VISTA_KEY_ALIAS: ${{ secrets.VISTA_KEY_ALIAS }}
          VISTA_KEY_PASSWORD: ${{ secrets.VISTA_KEY_PASSWORD }}
        run: gradle --no-daemon :app:assembleRelease

      - name: Verify offline map is embedded in release APK
        if: steps.release-signing.outputs.ready == 'true'
        run: |
          python3 - <<'PY'
          import zipfile
          from pathlib import Path
          apk = Path("app/build/outputs/apk/release/app-release.apk")
          required = ("assets/maps/el-bayadh.map", "assets/maps/el-bayadh-pois.json")
          with zipfile.ZipFile(apk) as archive:
              names = set(archive.namelist())
              missing = [name for name in required if name not in names]
              if missing:
                  raise SystemExit("Release APK is missing bundled offline map assets: " + ", ".join(missing))
              for name in required:
                  info = archive.getinfo(name)
                  if info.file_size <= 0:
                      raise SystemExit(f"Bundled asset is empty: {name}")
                  print(f"Verified in release APK: {name} ({info.file_size:,} bytes)")
          PY

      - name: Verify stable release APK
        if: steps.release-signing.outputs.ready == 'true'
        shell: bash
        run: |
          APK="app/build/outputs/apk/release/app-release.apk"
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          "$BUILD_TOOLS/zipalign" -c -v 4 "$APK"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK"
          sha256sum "$APK"

      - name: Upload stable signed release APK
        if: steps.release-signing.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: vista-el-bayadh-stable-release
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Verify APK alignment and signatures
        shell: bash
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          "$BUILD_TOOLS/zipalign" -c -v 4 "$APK"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK"
          "$BUILD_TOOLS/aapt" dump badging "$APK" | head -n 5
          sha256sum "$APK"

      - name: Upload verified debug APK
        uses: actions/upload-artifact@v4
        with:
          name: vista-el-bayadh-android16-compatible
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
