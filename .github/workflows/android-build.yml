name: Android build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-build-offline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  assemble-debug:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install optional user-confirmed field photo bundle
        shell: bash
        run: |
          BUNDLE="VISTA-El-Bayadh-Field-Photos-Integration.zip"
          if [ -f "$BUNDLE" ]; then
            unzip -o "$BUNDLE" -d .
            python3 - <<'PY'
          import json
          from pathlib import Path
          manifest = Path("app/src/main/assets/content/field-photo-gallery.json")
          data = json.loads(manifest.read_text(encoding="utf-8"))
          images = data.get("images", [])
          missing = [
              item.get("assetPath", "")
              for item in images
              if not (Path("app/src/main/assets") / item.get("assetPath", "")).is_file()
          ]
          if missing:
              raise SystemExit("Missing field gallery assets: " + ", ".join(missing))
          if any(item.get("recognitionApproved", False) for item in images):
              raise SystemExit("Field gallery photos must not be auto-approved for recognition.")
          print(f"Validated {len(images)} user-confirmed gallery photos.")
          PY
          else
            echo "No field-photo bundle uploaded; building without user field-photo assets."
          fi
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Restore offline recognition image cache
        uses: actions/cache@v4
        with:
          path: |
            app/src/main/assets/recognition/references
            app/src/main/assets/recognition/mobilenet_v3_small.tflite
          key: vista-recognition-seed-v3-${{ hashFiles('dataset/recognition/source-manifest.json', 'scripts/fetch_recognition_model.py') }}
          restore-keys: |
            vista-recognition-seed-v3-
      - name: Bundle offline recognition image assets
        env:
          VISTA_FETCH_REMOTE_SEED_IMAGES: 'false'
        run: python3 scripts/fetch_recognition_seed_images.py
      - name: Fetch and verify pinned MobileNetV3 model
        run: python3 scripts/fetch_recognition_model.py
      - name: Validate offline catalogue and local image index
        run: python3 scripts/validate_offline_catalogue.py
      - name: Validate field recognition dataset readiness
        run: |
          python3 -m py_compile scripts/register_field_photo.py scripts/verify_field_photo.py scripts/validate_recognition_dataset.py
          python3 scripts/validate_recognition_dataset.py
          python3 -m unittest scripts/test_recognition_dataset_validator.py
      - name: Run recognition policy unit tests
        run: gradle --no-daemon :app:testDebugUnitTest
      - name: Clean and assemble fresh APK
        run: gradle --no-daemon clean :app:assembleDebug
      - name: Verify APK alignment and signatures
        shell: bash
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          "$BUILD_TOOLS/zipalign" -c -v 4 "$APK"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK"
          "$BUILD_TOOLS/aapt" dump badging "$APK" | head -n 5
          sha256sum "$APK"
      - name: Upload verified debug APK
        uses: actions/upload-artifact@v4
        with:
          name: vista-el-bayadh-android16-compatible
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
